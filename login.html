<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#005aa9">
  <meta name="description" content="Sign in to the UBL compliance assistant">
  <title>Sign in · UBL Compliance Assistant</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">
  <link rel="stylesheet" href="styles.css?v=8">
</head>
<body class="login-page">

  <main class="login-shell">
    <form id="login-form" class="login-card">
      <div class="login-header">
        <span class="login-logo"><img src="assets/ubl-logo.png" alt="UBL"></span>
        <div>
          <p class="kicker">Welcome to Compliance Chatbot</p>
          <h1>Sign in to continue</h1>
        </div>
      </div>
        <br>
      <label class="field-label" for="email">Email address</label>
      <div class="field-input">
        <svg class="ico-fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5A1.5 1.5 0 0 1 4.5 4h15A1.5 1.5 0 0 1 21 5.5v.4l-9 6.2-9-6.2zM3 8.3l8.55 5.9a.8.8 0 0 0 .9 0L21 8.3v10.2a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></svg>
        <input id="email" name="email" type="email" autocomplete="username" required placeholder="name@ubl.com.pk">
      </div>

      <label class="field-label" for="password">Password</label>
      <div class="field-input">
        <svg class="ico-fill" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12 2a5 5 0 0 0-5 5v3H6.5A1.5 1.5 0 0 0 5 11.5v8A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5v-8a1.5 1.5 0 0 0-1.5-1.5H17V7a5 5 0 0 0-5-5zm3 8H9V7a3 3 0 0 1 6 0z"/></svg>
        <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••••">
      </div>

      <p id="login-error" class="login-error" hidden></p>

      <button id="login-button" type="submit" class="login-submit">
        <span>Log in</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>

      <div class="login-contact">
        <svg class="ico-fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5.5A1.5 1.5 0 0 1 4.5 4h15A1.5 1.5 0 0 1 21 5.5v.4l-9 6.2-9-6.2zM3 8.3l8.55 5.9a.8.8 0 0 0 .9 0L21 8.3v10.2a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></svg>
        <div>
          <strong>For Access - Contact</strong>
          <a href="mailto:krishin.lal@ubl.com.pk">krishin.lal@ubl.com.pk</a>
        </div>
      </div>

      <p class="login-footer">Developed by IT Data &amp; AI</p>
    </form>
  </main>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="login.js" defer></script>
</body>
</html>
