<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#005aa9">
  <meta name="description" content="Sign in to the UBL compliance assistant">
  <title>Sign in · UBL Compliance Assistant</title>
  <link rel="stylesheet" href="styles.css?v=1">
</head>
<body class="login-page">
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

  <main class="login-shell">
    <form id="login-form" class="login-card glass">
      <div class="login-header">
        <span class="ubl-mark" aria-hidden="true"><b>U</b><b>B</b><b>L</b></span>
        <div>
          <p class="kicker">Welcome back</p>
          <h1>Sign in to continue</h1>
        </div>
      </div>
      <p class="login-subtitle">Use your UBL account to access the compliance assistant.</p>

      <label class="field-label" for="email">Email address</label>
      <div class="field-input">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/></svg>
        <input id="email" name="email" type="email" autocomplete="username" required placeholder="name@ubl.com.pk">
      </div>

      <label class="field-label" for="password">Password</label>
      <div class="field-input">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••••">
      </div>

      <p id="login-error" class="login-error" hidden></p>

      <button id="login-button" type="submit" class="login-submit">
        <span>Log in</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>

      <div class="login-contact">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4z"/><path d="m4 7 8 6 8-6"/></svg>
        <div>
          <strong>For access, contact</strong>
          <a href="mailto:krishin.lal@ubl.com.pk">krishin.lal@ubl.com.pk</a>
        </div>
      </div>

      <p class="login-footer">Developed by IT Data &amp; AI</p>
    </form>
  </main>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="login.js" defer></script>
</body>
</html>
